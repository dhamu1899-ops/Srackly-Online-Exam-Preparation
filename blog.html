      <!-- Tag & Title -->

        <svg class="w-3.5 h-3.5 text-indigo-400 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M12 2v4"/><path d="m16.2 7.8 2.9-2.9"/></svg>

      <!-- Minimal Progress Bar -->
      <div class="w-full mt-6">
        <div class="flex items-center justify-between text-xs text-slate-400 mb-1.5 font-mono">
          <span>Loading</span>
          <span class="text-indigo-400 font-bold" id="preloader-percent">0%</span>
        </div>
        <div class="w-full h-1.5 bg-slate-900 rounded-full overflow-hidden border border-slate-800">
          <div id="preloader-progress-bar" class="h-full bg-indigo-500 rounded-full transition-all duration-75" style="width: 0%;"></div>
        </div>
      </div>

      <button id="preloader-skip" class="mt-6 text-[11px] text-slate-500 hover:text-slate-300 underline underline-offset-4 cursor-pointer transition">
